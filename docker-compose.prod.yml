version: '3.8'

# Production Docker Compose for Web App Droplet
# PostgreSQL and Redis run on DigitalOcean Managed Clusters via Private VPC

services:
  app:
    # Pull pre-built image from GitHub Container Registry (GHCR)
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: ride_share_api
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL} # Provided via Managed Postgres Private VPC URI
      - REDIS_URL=${REDIS_URL}       # Provided via Managed Redis Private VPC URI
      - TARGET_DB_NAME=ride_share_db
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: ride_share_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  caddydata:
  caddyconfig:
